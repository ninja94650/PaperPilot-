name: PaperPilot Office Editor Regression

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "feature/**"

permissions:
  contents: read

concurrency:
  group: paperpilot-office-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  office-editor-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22.13.1"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install PaperPilot dependencies
        run: npm ci
      - name: Install pinned fixture generators
        run: python -m pip install --disable-pip-version-check python-docx==1.1.2 python-pptx==1.0.2
      - name: Generate rich and malformed Office fixtures
        run: python tests/office/generate-fixtures.py
      - name: Validate Office archive security boundaries
        run: node --test tests/office/archive-validation.test.mjs
      - name: Install isolated browser tooling
        run: npm install --prefix "$RUNNER_TEMP/office-tools" --no-save --no-package-lock vite@8.3.5 playwright-core@1.57.0
      - name: Install Chromium
        run: "$RUNNER_TEMP/office-tools/node_modules/.bin/playwright-core" install --with-deps chromium
      - name: Start Office fixture server
        run: |
          "$RUNNER_TEMP/office-tools/node_modules/.bin/vite" --root tests/office/e2e --host 127.0.0.1 --port 4173 --strictPort > "$RUNNER_TEMP/office-vite.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/office-vite.pid"
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/office-vite.log"
          exit 1
      - name: Run Office edit-save-reopen and IndexedDB recovery tests
        run: |
          export OFFICE_E2E_TOOLS="$RUNNER_TEMP/office-tools"
          export OFFICE_E2E_URL="http://127.0.0.1:4173"
          node --test tests/office/e2e.test.mjs
      - name: Stop Office fixture server
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/office-vite.pid" ]; then kill "$(cat "$RUNNER_TEMP/office-vite.pid")" || true; fi
