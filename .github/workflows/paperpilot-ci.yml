name: PaperPilot CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: paperpilot-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22.13.1"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            worker/package-lock.json
      - name: Install root dependencies from lockfile
        run: npm ci
      - name: Install worker dependencies from lockfile
        run: npm ci --prefix worker
      - name: Audit root dependencies
        run: npm audit --audit-level=high
      - name: Audit worker dependencies
        working-directory: worker
        run: npm audit --audit-level=high
      - name: API ownership and IDOR regression tests
        run: npm run test:security
      - name: Worker input validation tests
        working-directory: worker
        run: npm test
      - name: Type check
        run: npm run typecheck
      - name: Production build
        run: npm run build

  database-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: paperpilot-ci
          POSTGRES_DB: paperpilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d paperpilot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: paperpilot-ci
      DATABASE_URL: postgresql://postgres:paperpilot-ci@localhost:5432/paperpilot_test
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Bootstrap isolated Supabase-compatible schema
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/bootstrap_disposable_postgres.sql
      - name: Apply secure processing migrations
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261124160750_paperpilot_secure_processing_pipeline.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261124160930_paperpilot_processing_scan_leases.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261124161225_paperpilot_scan_lease_exhaustion.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261124161331_paperpilot_cancel_expired_processing_jobs.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261124162518_paperpilot_processing_least_privilege_grants.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261124163000_paperpilot_atomic_revision_publish.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261124170000_paperpilot_processing_api_rate_limits.sql
      - name: Execute cross-tenant RLS, lease recovery and API rate-limit fixture
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/processing_pipeline_rls_and_recovery.sql

  clamav-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      clamav:
        image: clamav/clamav:1.4
        ports:
          - 3310:3310
    env:
      CLAMAV_INTEGRATION: "1"
      CLAMAV_HOST: 127.0.0.1
      CLAMAV_PORT: "3310"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22.13.1"
      - name: Install worker dependencies from lockfile
        run: npm ci --prefix worker
      - name: Wait for ClamAV and its loaded signature database
        run: |
          node --input-type=module <<'NODE'
          import { getClamAvVersion } from "./worker/clamav.mjs";
          const deadline = Date.now() + 300000;
          let lastError;
          while (Date.now() < deadline) {
            try {
              const version = await getClamAvVersion({ host: process.env.CLAMAV_HOST, port: Number(process.env.CLAMAV_PORT) });
              console.log("ClamAV ready:", version);
              process.exit(0);
            } catch (error) {
              lastError = error;
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
          }
          console.error("ClamAV did not become ready:", lastError);
          process.exit(1);
          NODE
      - name: Run live EICAR detection and clean-PDF scanner tests
        run: npm --prefix worker test
