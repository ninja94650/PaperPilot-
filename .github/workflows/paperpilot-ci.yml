name: PaperPilot CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: paperpilot-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22.13.1"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            worker/package-lock.json
      - name: Install root dependencies from lockfile
        run: npm ci
      - name: Install worker dependencies from lockfile
        run: npm ci --prefix worker
      - name: Audit root dependencies
        run: npm audit --audit-level=high
      - name: Audit worker dependencies
        working-directory: worker
        run: npm audit --audit-level=high
      - name: API ownership and IDOR regression tests
        run: npm run test:security
      - name: Worker input validation tests
        working-directory: worker
        run: npm test
      - name: Type check
        run: npm run typecheck
      - name: Production build
        run: npm run build
