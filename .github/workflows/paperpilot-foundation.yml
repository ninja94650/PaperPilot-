name: PaperPilot foundation recovery
on:
  push:
    branches:
      - fix/month1-main-build-recovery-20261126
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: paperpilot-foundation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22.16.0"
      - name: Bootstrap a lockfile only when the repository does not yet have one
        id: lockfile
        shell: bash
        run: |
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
            echo "generated=true" >> "$GITHUB_OUTPUT"
          else
            echo "generated=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install from the generated or committed lockfile
        run: npm ci
      - name: Capture complete dependency audit report
        run: npm audit --json > npm-audit.json || true
      - name: Enforce high and critical dependency audit gate
        id: audit
        continue-on-error: true
        run: npm audit --audit-level=high
      - name: Run PDF action dispatch regression tests
        run: npm run test:regression
      - name: Generate direct dependency licence register
        run: npm run licensing:generate
      - name: Generate CycloneDX SBOM when missing or the lockfile changed
        shell: bash
        run: |
          regenerate=false
          if [ ! -f sbom.cdx.json ] || [ "${{ steps.lockfile.outputs.generated }}" = "true" ]; then
            regenerate=true
          elif git diff --quiet HEAD^ HEAD -- package-lock.json; then
            regenerate=false
          else
            regenerate=true
          fi
          if [ "$regenerate" = "true" ]; then
            npm sbom --sbom-format cyclonedx > sbom.cdx.json
          fi
      - name: Type check
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Upload lockfile, audit, licence register and SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paperpilot-foundation-${{ github.sha }}
          path: |
            package-lock.json
            npm-audit.json
            docs/licensing-register.md
            sbom.cdx.json
          if-no-files-found: warn
      - name: Fail if dependency audit did not pass
        if: ${{ always() && steps.audit.outcome == 'failure' }}
        run: exit 1

  commit-generated-artifacts:
    needs: foundation
    if: ${{ github.event_name == 'push' && needs.foundation.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Download generated repository artefacts
        uses: actions/download-artifact@v4
        with:
          name: paperpilot-foundation-${{ github.sha }}
          path: .
      - name: Commit lockfile, licence register and SBOM to the recovery branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json docs/licensing-register.md sbom.cdx.json
          if ! git diff --cached --quiet; then
            git commit -m "build: record lockfile, licensing register and SBOM"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "Generated repository artefacts are already current."
          fi
